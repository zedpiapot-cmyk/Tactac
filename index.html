<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:#542b3b}body{background:linear-gradient(180deg,#fff1f6,#fce5ee 55%,#fff5f8)}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 24px}.card{width:min(680px,100%);background:rgba(255,255,255,.95);border-radius:44px;padding:58px 30px;box-shadow:0 24px 60px rgba(126,49,79,.14);text-align:center}h1{font-size:clamp(42px,10vw,60px);margin:0 0 28px;color:#542536}.heart{font-weight:400}.subtitle{font-size:clamp(21px,5vw,29px);line-height:1.45;color:#765866;margin:0 auto 38px}button{border:0;border-radius:999px;background:#c13b68;color:#fff;font:bold 22px Arial,sans-serif;padding:18px 44px;box-shadow:0 14px 28px rgba(193,59,104,.23);cursor:pointer}button:active{transform:scale(.97)}.hidden{display:none!important}
#reasonScreen .card{padding:38px 22px 48px}.reason-number{font-size:24px;color:#8b5a6b;margin-bottom:22px}.reason-text{font-size:clamp(27px,6.8vw,39px);line-height:1.35;min-height:170px;display:flex;align-items:center;justify-content:center;color:#5b3040;padding:15px}.progress{font:16px Arial,sans-serif;color:#9a7180;margin:25px 0}.final-text{font-size:clamp(23px,5.5vw,31px);line-height:1.6;color:#633849;margin:0 auto 38px}.footer{text-align:center;font:16px Arial,sans-serif;color:#111;padding:0 10px 25px}
@media(max-width:500px){.page{padding:60px 15px}.card{border-radius:40px;padding:50px 23px}.reason-text{min-height:190px}}
</style>
</head>
<body>
<audio id="yourUniverse" preload="auto"><source src="./your-universe.mp3" type="audio/mpeg"></audio>
<audio id="bawatDaan" preload="auto"><source src="./bawat-daan.mp3" type="audio/mpeg"></audio>
<audio id="coPilot" preload="auto"><source src="./co-pilot.mp3" type="audio/mpeg"></audio>

<section id="welcome" class="page">
<div class="card">
<h1>For You<span class="heart">♡</span></h1>
<p class="subtitle">144 reasons why I love you<br>144 para mas marami Kesa sayo 🙄</p>
<button id="openBtn">Open Me</button>
</div>
</section>

<section id="reasonScreen" class="page hidden">
<div class="card">
<div id="reasonNumber" class="reason-number"></div>
<div id="reasonText" class="reason-text"></div>
<div id="progress" class="progress"></div>
<button id="nextBtn">Next ♡</button>
</div>
</section>

<section id="finalScreen" class="page hidden">
<div class="card">
<h1>For You<span class="heart">♡</span></h1>
<p class="final-text">Thank you for being you. After all 144 reasons, I still can't fit everything I love about you into a list. I hope you always remember how special you are to me. ♡</p>
<div style="font-size:58px">♡</div>
</div>
</section>
<div class="footer">zedpiapot-cmyk.github.io</div>

<script>

];

if(reasons.length!==144) throw new Error('Expected 144 reasons, got '+reasons.length);
const welcome=document.getElementById('welcome'), screen=document.getElementById('reasonScreen'), finalScreen=document.getElementById('finalScreen');
const openBtn=document.getElementById('openBtn'), nextBtn=document.getElementById('nextBtn');
const number=document.getElementById('reasonNumber'), text=document.getElementById('reasonText'), progress=document.getElementById('progress');
const yu=document.getElementById('yourUniverse'), bd=document.getElementById('bawatDaan'), cp=document.getElementById('coPilot');
let index=0;
function stop(a){a.pause();a.currentTime=0;}
function showReason(){number.textContent=(index+1)+'.';text.textContent=reasons[index];progress.textContent=(index+1)+' of 144';nextBtn.textContent=index===143?'Done ♡':'Next ♡';window.scrollTo({top:0,behavior:'smooth'});}
openBtn.addEventListener('click',async()=>{stop(yu);stop(cp);welcome.classList.add('hidden');finalScreen.classList.add('hidden');screen.classList.remove('hidden');index=0;showReason();try{await bd.play()}catch(e){console.log(e)}});
nextBtn.addEventListener('click',async()=>{if(index<143){index++;showReason();return}stop(bd);stop(yu);screen.classList.add('hidden');finalScreen.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});try{await cp.play()}catch(e){console.log(e)}});
</script>
</body>
</html>
